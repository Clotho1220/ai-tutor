<!DOCTYPE html><html lang="zh-TW"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tutor - 開發者除錯面板</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #1e1e1e; color: #d4d4d4; margin: 0; padding: 15px; padding-bottom: 95px; display: flex; flex-direction: column; min-height: 100vh; box-sizing: border-box; }
        .control-bar { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; justify-content: space-between; background: #252526; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #3c3c3c; }
        .control-group { display: flex; gap: 10px; align-items: center; font-size: 14px; flex-wrap: wrap; }
        select { background: #3c3c3c; color: white; border: 1px solid #555; padding: 5px 10px; border-radius: 4px; }
        button { background: #0e639c; color: white; border: none; padding: 8px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #555; cursor: not-allowed; }
        #nextStageBtn { background: #7d3c98; }
        #statusBadge { padding: 5px 10px; border-radius: 4px; background: #5c4d0c; color: #ffcc00; font-weight: bold; font-size: 13px; }

        /* 版面：上排 AI / 使用者對話（固定約 6 行高，內部捲動），
           下排 圖片 / System Log（Log 墊底） */
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; flex-grow: 1; min-height: 0; align-content: start; }
        .panel { background: #252526; border: 1px solid #3c3c3c; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
        .panel-header { background: #333333; padding: 8px 12px; font-size: 13px; font-weight: bold; border-bottom: 1px solid #3c3c3c; display: flex; justify-content: space-between; }
        .panel-content { padding: 12px; overflow-y: auto; flex-grow: 1; font-size: 14px; line-height: 1.5; font-family: monospace; }

        /* 對話面板：固定約 6 行文字高，超出時內部捲動（程式會自動捲到最新） */
        .panel-chat .panel-content { height: 130px; flex-grow: 0; }
        .panel-image .panel-content { height: 230px; flex-grow: 0; }
        .panel-log .panel-content { height: 200px; flex-grow: 0; }

        #sysLogBox { color: #4af626; font-size: 12px; }
        #aiSpeechBox { color: #e5e5e5; font-family: sans-serif; }
        #userSpeechBox { color: #4daafc; font-family: sans-serif; }
        .image-container { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #666; }
        #generatedImage { max-width: 100%; max-height: 190px; border-radius: 8px; display: none; margin-bottom: 10px; }
        #imageCaption { font-size: 12px; color: #aaa; }

        /* Push-to-talk 說話按鈕：固定在畫面底部中央 */
        #talkBtn { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 100;
                   padding: 16px 44px; border-radius: 50px; font-size: 17px; font-weight: bold;
                   background: #0e639c; color: #fff; border: none; cursor: pointer; white-space: nowrap;
                   box-shadow: 0 4px 14px rgba(0,0,0,0.5); -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        #talkBtn:disabled { background: #555; box-shadow: none; }
        #talkBtn.talking { background: #c0392b; animation: talkPulse 1.2s infinite; }
        @keyframes talkPulse {
            0%   { box-shadow: 0 0 0 0 rgba(192,57,43,0.55); }
            70%  { box-shadow: 0 0 0 18px rgba(192,57,43,0); }
            100% { box-shadow: 0 0 0 0 rgba(192,57,43,0); }
        }

        /* 手機：單欄，順序 AI → 使用者 → 圖片 → Log（Log 墊底） */
        @media (max-width: 768px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            .panel-chat .panel-content { height: 120px; }
            .panel-image .panel-content { height: 200px; }
            .panel-log .panel-content { height: 160px; }
        }
    </style></head><body>
    <div class="control-bar">
        <div class="control-group">
            <strong>AI Tutor Dev</strong>
            <span id="statusBadge">未連線</span>
            <span id="stageIndicator" style="color: #4daafc; margin-left: 10px;">⏳ 等待連線</span>
        </div>
        <div class="control-group">
            <input type="password" id="apiKeyInput" placeholder="Gemini API Key" style="background:#3c3c3c; color:#fff; border:1px solid #555; padding:6px 10px; border-radius:4px; width:150px;">
            <label><input type="radio" name="audioMode" value="headphone" checked> 🎧 耳機</label>
            <label><input type="radio" name="audioMode" value="speaker"> 🔊 喇叭</label>
            <select id="modelSelect" title="模型選擇">
                <option value="models/gemini-2.5-flash-native-audio-latest">原生語音 2.5（自然但音色會飄）</option>
                <option value="models/gemini-live-2.5-flash-preview">Half-cascade 2.5（音色穩定）</option>
                <option value="models/gemini-2.0-flash-live-001">Half-cascade 2.0（備用）</option>
            </select>
            <select id="daySelect" title="週教案：上第幾天（自動＝依日期推進）">
                <option value="auto">📅 自動排課</option>
                <option value="1">第 1 天</option>
                <option value="2">第 2 天</option>
                <option value="3">第 3 天</option>
                <option value="4">第 4 天</option>
                <option value="5">第 5 天</option>
            </select>
            <select id="voiceSelect"><option value="Aoede">Aoede</option><option value="Kore">Kore</option><option value="Puck">Puck</option><option value="Charon">Charon</option><option value="Fenrir">Fenrir</option></select>
            <button id="nextStageBtn" disabled>⏭ Next</button>
            <button id="actionBtn">開始連線</button>
        </div>
    </div>
    <div class="dashboard-grid">
        <div class="panel panel-chat"><div class="panel-header"><span>🤖 AI Speech Transcript</span></div><div class="panel-content" id="aiSpeechBox"></div></div>
        <div class="panel panel-chat"><div class="panel-header"><span>🗣️ User Input (Audio/Text)</span></div><div class="panel-content" id="userSpeechBox">等待音訊輸入...</div></div>
        <div class="panel panel-image"><div class="panel-header"><span>🖼️ Generated Image (Tool Call)</span></div><div class="panel-content image-container"><img id="generatedImage" src="" alt="AI Image"><div id="imageCaption">等待 AI 觸發畫圖指令...</div></div></div>
        <div class="panel panel-log"><div class="panel-header"><span>⚙️ System & Event Log</span></div><div class="panel-content" id="sysLogBox">準備就緒。</div></div>
    </div>
    <button id="talkBtn" disabled>🎙️ 按一下開始說話</button>
    <script src="app.js"></script></body></html>
